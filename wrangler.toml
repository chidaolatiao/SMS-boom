# Cloudflare Workers 配置文件
name = "sms-boom"
main = "index.js"
compatibility_date = "2024-01-01"

# 静态资源配置
[assets]
directory = "."
binding = "ASSETS"
# ⚠️ 修复（2026-08-23）：必须让 Worker 先于静态资产执行。
#    默认（未配置时）静态资产优先：/?url=... 代理请求（pathname 为 "/"）命中 index.html，
#    直接被静态服务返回（GET 200 HTML / POST 405），Worker 代码完全不执行——
#    这是"重新构建后仍大量失败"的真正根因（无论 index.js 怎么修都不生效）。
run_worker_first = true
